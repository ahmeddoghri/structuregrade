[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "structuregrade"
version = "0.1.0"
description = "AlphaFold and PDB confidence and geometry quality gate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Doghri"}]
dependencies = []

[project.scripts]
structuregrade = "structuregrade.cli:main"

[tool.setuptools]
packages = ["structuregrade"]

[tool.setuptools.package-data]
structuregrade = ["web/*.html"]
